# Added by ownpanel's install.sh: restarting nftables flushes the whole
# ruleset, including the packet filter that keeps builds away from this
# server; this puts it back right away. (The build service also checks for
# it before and during every build and builds nothing without it.)
[Service]
ExecStartPost=-/usr/local/lib/ownpanel/ownpanel-build-setup firewall

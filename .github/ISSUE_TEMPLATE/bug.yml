name: Bug report
description: Something does not work as described
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
  - type: input
    id: version
    attributes:
      label: ownpanel version
      description: Output of `ownpaneld version`, or Settings → Updates.
      placeholder: v0.1.0 or nightly-20261125-abc1234
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Sites and publishing, Domains and DNS, Redirects, Users and access tokens, Installer and updates, Setup and settings, MCP / API, Other]
  - type: input
    id: system
    attributes:
      label: Server
      description: Distribution and architecture, e.g. Ubuntu 26.04 arm64.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl -u ownpaneld -u ownpanel-caddy --since '10 min ago'`. Remove secrets, tokens and domains you do not want to share."
      render: text

# Builds the release archives with scripts/package.sh and publishes them.
# Two channels, one build:
#   nightly  every push to main (every merged pull request): the rolling
#            prerelease "nightly" (tag moved to the built commit, assets
#            replaced; never "latest"). Skipped if the nightly tag already
#            points at that commit.
#   stable   every push to the branch release (a merged pull request
#            main -> release): the tag job computes the next version from the
#            Conventional Commits since the last v* tag (fix: patch, feat:
#            minor, feat!: or BREAKING CHANGE: major) and pushes the tag
#            v<version>; the release job publishes it as "latest". A push
#            without such commits releases nothing.
# Run it by hand with "dry-run" to build without publishing (the archives are
# kept as a workflow artifact), or with "nightly" to publish a nightly now.
# If a stable release fails after its tag was pushed, use "Re-run failed
# jobs": re-running the tag job finds the tag already there and releases
# nothing. install.sh downloads from these releases.
name: Release

on:
  push:
    branches: [main, release]
  workflow_dispatch:
    inputs:
      publish:
        description: "dry-run: build only. nightly: publish the nightly prerelease (main only)."
        type: choice
        options: [dry-run, nightly]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the tag v<version>
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous-version: ${{ steps.version.outputs.previous-version }}
      tag-created: ${{ steps.version.outputs.tag-created }}
    steps:
      # The full history and all tags to find the last release; the action
      # pushes the new tag with the credentials checkout leaves behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: wemogy/get-release-version-action@ce83cb81cc4a9b120ff773b0f6c7be0d6ce0f9cf # v4.3.7
        id: version
        with:
          prefix: v
          git-username: github-actions[bot]
          git-email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Report
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous-version }}
          CREATED: ${{ steps.version.outputs.tag-created }}
        run: |
          if [ "$CREATED" = true ]; then
            echo "Releasing v$VERSION (previous: ${PREVIOUS:+v}${PREVIOUS:-none})." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No feat: or fix: commits since ${PREVIOUS:+v}${PREVIOUS:-the start}; nothing to release." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: tag
    # After the tag job only if it pushed a tag; without it (main, manual
    # runs) always.
    if: >-
      !cancelled() &&
      (needs.tag.result == 'skipped' ||
       (needs.tag.result == 'success' && needs.tag.outputs.tag-created == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create releases, move the nightly tag
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide what to build
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.publish }}
          REF: ${{ github.ref }}
          TAG_VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          case "$EVENT/$REF" in
            push/refs/heads/main) mode=nightly ;;
            push/refs/heads/release) mode=stable ;;
            push/*) echo "::error::Unexpected push to $REF."; exit 1 ;;
            *) mode=${INPUT:-dry-run} ;;
          esac
          if [ "$mode" = stable ]; then
            [ -n "$TAG_VERSION" ] || { echo "::error::The tag job reported no version."; exit 1; }
            version=v$TAG_VERSION
          else
            version="${mode/dry-run/dryrun}-$(date -u +%Y%m%d)-${SHA::7}"
          fi
          if [ "$mode" = nightly ] && [ "$REF" != refs/heads/main ]; then
            echo "::error::Nightly builds are made from main; this run is on $REF."
            exit 1
          fi
          skip=false
          # A push to main skips when the nightly tag already points at it.
          # A manual run always builds, e.g. to repair a failed upload.
          if [ "$mode" = nightly ] && [ "$EVENT" = push ]; then
            last=$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
            if [ "$last" = "$SHA" ]; then
              echo "The nightly is already built from $SHA; nothing to do."
              skip=true
            fi
          fi
          echo "Mode $mode, version $version, skip $skip"
          {
            echo "mode=$mode"
            echo "version=$version"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.meta.outputs.skip != 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.meta.outputs.skip != 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the archives
        if: steps.meta.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: scripts/package.sh "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.meta.outputs.skip != 'true'
        with:
          name: ownpanel-${{ steps.meta.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7

      - name: Publish the stable release
        if: steps.meta.outputs.skip != 'true' && steps.meta.outputs.mode == 'stable'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PREVIOUS: ${{ needs.tag.outputs.previous-version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # A re-run: same tag, same archive names; replace them.
            echo "Release $VERSION exists; uploading the archives again."
            gh release upload "$VERSION" dist/ownpanel_*.tar.gz --clobber
            gh release upload "$VERSION" dist/checksums.txt --clobber
            exit 0
          fi
          # Notes list the pull requests merged since the previous release.
          flags=(--verify-tag --title "$VERSION" --generate-notes)
          if [ -n "$PREVIOUS" ] && [ "v$PREVIOUS" != "$VERSION" ]; then
            flags+=(--notes-start-tag "v$PREVIOUS")
          fi
          case "$VERSION" in
            *-*) flags+=(--prerelease --latest=false) ;;
            *) flags+=(--latest) ;;
          esac
          gh release create "$VERSION" dist/ownpanel_*.tar.gz dist/checksums.txt "${flags[@]}"

      - name: Publish the nightly prerelease
        if: steps.meta.outputs.skip != 'true' && steps.meta.outputs.mode == 'nightly'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$SHA" >/dev/null
          fi
          notes="Automatic build of main at ${SHA} (${VERSION}). For testing, not for production.

          Install or switch to it with:
          curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/main/install.sh | sudo bash -s -- --channel nightly"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --latest=false --title "Nightly ${VERSION}" --notes "$notes"
          else
            gh release create nightly --verify-tag --prerelease --latest=false --title "Nightly ${VERSION}" --notes "$notes"
          fi
          old=$(gh release view nightly --json assets --jq '.assets[].name')
          # New archives first, then checksums.txt, then the old archives go:
          # checksums.txt never names a file that is missing.
          gh release upload nightly dist/ownpanel_*.tar.gz --clobber
          gh release upload nightly dist/checksums.txt --clobber
          for asset in $old; do
            if [ "$asset" != checksums.txt ] && [ ! -e "dist/$asset" ]; then
              gh release delete-asset nightly "$asset" --yes
            fi
          done

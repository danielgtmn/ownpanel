# Checks every change. The job names (go, web, lint, build) are used as
# required status checks in the branch protection rules; renaming one
# means updating the rules as well. "go" only sums up the parallel Go jobs
# "go (vet)" and "go (<group>)". The action job (the publish GitHub
# Action against a real ownpaneld) is not required.
#
# On pull requests, jobs run only when files they check changed (a skipped
# job counts as passed for the branch rules). Pushes to main and release,
# the merge queue and manual runs always run everything. Pull requests into
# release are checked like any other. The pull request title check
# ("commits") is in commits.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main, release]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      lint: ${{ steps.filter.outputs.lint }}
      build: ${{ steps.filter.outputs.build }}
      action: ${{ steps.filter.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide which checks to run
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          all() { for k in go web lint build action; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; }
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" "$AFTER")"
          elif [ "$EVENT" != "pull_request" ]; then
            echo "No pull request and no previous commit to compare with: running every check."
            all
            exit 0
          else
            files="$(git diff --name-only "$BASE...$HEAD")"
          fi
          echo "Changed files:"
          echo "$files"
          # A change to this workflow must prove itself on every job.
          if grep -qx '.github/workflows/ci.yml' <<<"$files"; then
            all
            exit 0
          fi
          has() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          go="$(has '(\.go$|^go\.(mod|sum)$)')"
          web="$(has '^web/')"
          lint="$(has '(\.sh$|^deploy/|^\.github/workflows/)')"
          # The action talks to the API, so API changes test it as well.
          action="$(has '(^actions/|^internal/(api|panel|deploy)/.*\.go$)')"
          build=false
          if [ "$go" = true ] || [ "$web" = true ] || [ "$(has '^(Makefile|scripts/package\.sh)$')" = true ]; then
            build=true
          fi
          {
            echo "go=$go"
            echo "web=$web"
            echo "lint=$lint"
            echo "build=$build"
            echo "action=$action"
          } | tee -a "$GITHUB_OUTPUT"

  # The Go checks are split into jobs that run in parallel: go-vet (format,
  # vet, and that the test groups cover every test) and one go-test job per
  # group of scripts/go-test-group.sh. The job "go" sums them up for the
  # branch rules.
  go-vet:
    name: go (vet)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not formatted, run gofmt -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Every test runs in exactly one group
        env:
          # Keep in sync with the matrix of go-test.
          MATRIX: panel-1 panel-2 panel-3 panel-4 mail rest
        run: |
          groups="$(scripts/go-test-group.sh groups | paste -sd' ' -)"
          if [ "$groups" != "$MATRIX" ]; then
            echo "::error::The go-test matrix ($MATRIX) does not match scripts/go-test-group.sh groups ($groups)."
            exit 1
          fi
          scripts/go-test-group.sh check

  go-test:
    name: go (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [panel-1, panel-2, panel-3, panel-4, mail, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        env:
          GROUP: ${{ matrix.group }}
        run: scripts/go-test-group.sh "$GROUP"

  # The required check "go": passes when the Go jobs passed, or when no Go
  # file changed and they were skipped.
  go:
    needs: [changes, go-vet, go-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sum up the Go jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.go }}
          VET: ${{ needs.go-vet.result }}
          TEST: ${{ needs.go-test.result }}
        run: |
          echo "changes=$CHANGES go=$RUN vet=$VET test=$TEST"
          if [ "$CHANGES" != success ]; then
            echo "::error::Deciding which checks to run failed."
            exit 1
          fi
          if [ "$RUN" != true ]; then
            echo "No Go file changed."
            exit 0
          fi
          if [ "$VET" != success ] || [ "$TEST" != success ]; then
            echo "::error::A Go job did not pass."
            exit 1
          fi

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          shellcheck --version
          shellcheck "${scripts[@]}"
      - name: Script tests
        run: |
          for t in scripts/*_test.sh; do
            echo "::group::$t"
            "$t"
            echo "::endgroup::"
          done
      - name: actionlint
        # The preinstalled shellcheck is picked up for the run: blocks.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  build:
    needs: [changes, go-vet, web]
    # Runs after go-vet and web (not after the tests, to save time), also
    # when one of them was skipped, never after a failure.
    if: >-
      !cancelled() &&
      needs.changes.outputs.build == 'true' &&
      needs.go-vet.result != 'failure' &&
      needs.web.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build the daemon for linux/amd64 and linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          for arch in amd64 arm64; do
            echo "::group::linux/${arch}"
            GOARCH="$arch" go build -tags webui -trimpath -o "${RUNNER_TEMP}/ownpaneld-linux-${arch}" ./cmd/ownpaneld
            ls -l "${RUNNER_TEMP}/ownpaneld-linux-${arch}"
            echo "::endgroup::"
          done

  action:
    needs: changes
    if: needs.changes.outputs.action == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Publish action against a real ownpaneld
        run: actions/publish/publish_test.sh
